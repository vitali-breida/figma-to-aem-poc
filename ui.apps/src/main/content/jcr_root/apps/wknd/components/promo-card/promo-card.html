<sly data-sly-use.model="com.adobe.aem.guides.wknd.core.models.PromoCard"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"/>

<sly data-sly-test="${model.empty}">
    <sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=true}"/>
    CCC
</sly>

<div class="cmp-promo-card ${model.styleClasses}" 
     data-cmp-is="promo-card"
     data-sly-test="${!model.empty}">

    <div class="cmp-promo-card__image">
        <sly data-sly-resource="${'.' @ resourceType='core/wcm/components/image/v3/image'}"/>
    </div>

    <div class="cmp-promo-card__content">
        <h2 class="cmp-promo-card__title">${model.title @ context='html'}</h2>
        <p class="cmp-promo-card__description">${model.description @ context='html'}</p>
    </div>
</div>
