<sly data-sly-use.model="com.adobe.aem.guides.wknd.core.models.JobsEmptyState"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"/>

<sly data-sly-test="${model.empty}">
    <sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=true}"/>
</sly>

<div class="cmp-jobs-empty-state" data-sly-test="${!model.empty}">
    <h2 class="cmp-jobs-empty-state__heading">${model.heading @ context='html'}</h2>
    <div class="cmp-jobs-empty-state__cta">
        <a class="cmp-jobs-empty-state__link" href="${model.linkHref @ context='uri'}">
            <span class="cmp-jobs-empty-state__link-text">${model.linkText @ context='html'}</span>
            <span class="cmp-jobs-empty-state__link-icon" aria-hidden="true"></span>
        </a>
    </div>
</div>
