<sly data-sly-use.model="com.adobe.aem.guides.wknd.core.models.DanoneFooter"/>
<footer class="cmp-danone-footer">

    <div class="cmp-danone-footer__cta">
        <a class="cmp-danone-footer__cta-link"
           href="${model.jobsAllUrl @ context='uri'}">
            ${model.jobsAllLabel @ context='text'}
            <span class="cmp-danone-footer__cta-arrow" aria-hidden="true">&#8594;</span>
        </a>
    </div>

    <nav class="cmp-danone-footer__nav" aria-label="Footer navigation">
        <ul class="cmp-danone-footer__nav-row">
            <li><a class="cmp-danone-footer__nav-link" href="#">TEAMS</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">BRANDS</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">OUR PROMISE</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">LIFE AT DANONE</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">STORIES</a></li>
        </ul>
        <ul class="cmp-danone-footer__nav-row">
            <li><a class="cmp-danone-footer__nav-link" href="#">COUNTRIES</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">OFFICES</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">FACTORIES</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">RESEARCH &amp; INNOVATION CENTRES</a></li>
            <li><a class="cmp-danone-footer__nav-link" href="#">GRADUATES &amp; TRAINEES</a></li>
        </ul>
    </nav>

    <div class="cmp-danone-footer__social">
        <a class="cmp-danone-footer__social-link cmp-danone-footer__social-link--facebook"
           href="${model.facebookUrl @ context='uri'}"
           aria-label="Facebook"
           target="_blank"
           rel="noopener noreferrer">
            <span class="cmp-danone-footer__social-icon" aria-hidden="true"></span>
        </a>
        <a class="cmp-danone-footer__social-link cmp-danone-footer__social-link--instagram"
           href="${model.instagramUrl @ context='uri'}"
           aria-label="Instagram"
           target="_blank"
           rel="noopener noreferrer">
            <span class="cmp-danone-footer__social-icon" aria-hidden="true"></span>
        </a>
        <a class="cmp-danone-footer__social-link cmp-danone-footer__social-link--linkedin"
           href="${model.linkedinUrl @ context='uri'}"
           aria-label="LinkedIn"
           target="_blank"
           rel="noopener noreferrer">in</a>
    </div>

    <div class="cmp-danone-footer__copyright">
        ${model.copyrightText @ context='text'}
    </div>

</footer>
